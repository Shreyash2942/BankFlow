bankflow:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('BANKFLOW_DBT_HOST', 'localhost') }}"
      port: "{{ env_var('BANKFLOW_DBT_PORT', '5432') | int }}"
      dbname: "{{ env_var('BANKFLOW_DBT_DATABASE') }}"
      user: "{{ env_var('BANKFLOW_DBT_USER') }}"
      password: "{{ env_var('BANKFLOW_DBT_PASSWORD') }}"
      schema: "{{ env_var('BANKFLOW_DBT_SCHEMA', 'bankflow_analytics') }}"
      threads: "{{ env_var('BANKFLOW_DBT_THREADS', '2') | int }}"
      connect_timeout: 10
      keepalives_idle: 0
