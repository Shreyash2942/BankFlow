version: 2

sources:
  - name: bankflow
    description: Validated operational events persisted by the Day 10 Kafka consumer.
    schema: bankflow
    tables:
      - name: consumed_events
        description: Append-only versioned event envelopes with Kafka ingestion metadata.
        loaded_at_field: consumed_at
        columns:
          - name: event_id
            description: Globally unique event-envelope identifier.
            data_tests:
              - not_null
              - unique
          - name: event_type
            data_tests:
              - not_null
              - accepted_values:
                  values:
                    - authentication.succeeded
                    - authentication.failed
                    - card.locked
                    - session.ended
                    - balance.viewed
                    - withdrawal.requested
                    - withdrawal.completed
                    - withdrawal.declined
                    - deposit.completed
                    - account.closed
          - name: schema_version
            data_tests:
              - not_null
              - accepted_values:
                  values: [1]
                  quote: false
          - name: occurred_at
            data_tests: [not_null]
          - name: source
            data_tests:
              - not_null
              - accepted_values:
                  values: [bankflow.application]
          - name: payload
            data_tests: [not_null]
          - name: topic
            data_tests: [not_null]
          - name: partition
            data_tests: [not_null]
          - name: offset
            quote: true
            data_tests: [not_null]
          - name: consumed_at
            data_tests: [not_null]

  - name: bankflow_serving
    description: Idempotent PostgreSQL mirror of selected Iceberg Gold aggregates.
    schema: bankflow_serving
    tables:
      - name: analytics_daily_transactions
        description: Gold daily transaction metrics at date and currency grain.
        loaded_at_field: loaded_at
        columns:
          - name: metric_date
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: monetary_attempt_count
            data_tests: [not_null]
          - name: success_rate
            data_tests: [not_null]
          - name: decline_rate
            data_tests: [not_null]
          - name: source_gold_processed_at
            data_tests: [not_null]
          - name: loaded_at
            data_tests: [not_null]

      - name: analytics_authentication_metrics
        description: Gold daily authentication and lockout metrics.
        loaded_at_field: loaded_at
        columns:
          - name: metric_date
            data_tests: [not_null, unique]
          - name: authentication_event_count
            data_tests: [not_null]
          - name: source_gold_processed_at
            data_tests: [not_null]
          - name: loaded_at
            data_tests: [not_null]

      - name: analytics_account_activity
        description: Gold account-day activity, balances, and closure state.
        loaded_at_field: loaded_at
        columns:
          - name: metric_date
            data_tests: [not_null]
          - name: account_id
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: activity_event_count
            data_tests: [not_null]
          - name: source_gold_processed_at
            data_tests: [not_null]
          - name: loaded_at
            data_tests: [not_null]

      - name: analytics_hourly_volume
        description: Gold hourly transaction-event volume by type and status.
        loaded_at_field: loaded_at
        columns:
          - name: event_hour
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: transaction_type
            data_tests: [not_null]
          - name: transaction_status
            data_tests: [not_null]
          - name: transaction_event_count
            data_tests: [not_null]
          - name: source_gold_processed_at
            data_tests: [not_null]
          - name: loaded_at
            data_tests: [not_null]
