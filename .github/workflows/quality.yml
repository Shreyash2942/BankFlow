name: BankFlow V1 quality

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankflow-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and service-free tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install application and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip check
      - name: Validate Python environment
        run: python scripts/check_environment.py
      - name: Lint and format
        run: |
          python -m ruff check airflow src pages consumers scripts tests migrations
          python -m ruff format --check airflow src pages consumers scripts tests migrations
      - name: Run service-free regression suite
        run: python -m pytest -q

  integrations:
    name: PostgreSQL, Redis, and Kafka integrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      kafka:
        image: apache/kafka:3.7.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Provision isolated database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bankflow_user LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE bankflow_test_user LOGIN PASSWORD 'ci-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE bankflow OWNER bankflow_user;
          CREATE DATABASE bankflow_test OWNER bankflow_test_user;
          REVOKE CONNECT ON DATABASE bankflow FROM PUBLIC;
          GRANT CONNECT ON DATABASE bankflow TO bankflow_user;
          SQL
      - name: Write CI test configuration
        run: |
          cat > .env.test <<'EOF'
          APP_ENV=test
          POSTGRES_HOST=127.0.0.1
          POSTGRES_PORT=5432
          POSTGRES_DB=bankflow_test
          POSTGRES_USER=bankflow_test_user
          POSTGRES_PASSWORD=ci-test-password
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_USERNAME=
          REDIS_PASSWORD=
          REDIS_DB=1
          KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092
          KAFKA_TRANSACTION_TOPIC=bankflow.transaction.events
          KAFKA_CONSUMER_GROUP=bankflow-ci
          KAFKA_CLIENT_ID=bankflow-ci-producer
          KAFKA_CONSUMER_CLIENT_ID=bankflow-ci-consumer
          EOF
      - name: Run live integration suite
        env:
          BANKFLOW_RUN_DB_TESTS: "1"
          BANKFLOW_RUN_KAFKA_TESTS: "1"
        run: python -m pytest -q

  analytics:
    name: dbt analytics build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bankflow_test
          POSTGRES_USER: bankflow_test_user
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bankflow_test_user -d bankflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dbt
        run: python -m pip install dbt-core==1.8.7 dbt-postgres==1.8.2
      - name: Create analytics source contract
        env:
          PGPASSWORD: ci-test-password
        run: |
          psql -h 127.0.0.1 -U bankflow_test_user -d bankflow_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA bankflow AUTHORIZATION bankflow_test_user;
          CREATE TABLE bankflow.consumed_events (
            event_id uuid PRIMARY KEY,
            event_type varchar(100) NOT NULL,
            schema_version integer NOT NULL,
            occurred_at timestamptz NOT NULL,
            source varchar(100) NOT NULL,
            aggregate_id uuid NOT NULL,
            payload jsonb NOT NULL,
            topic varchar(255) NOT NULL,
            partition integer NOT NULL,
            kafka_offset bigint NOT NULL,
            consumer_group varchar(255) NOT NULL,
            consumed_at timestamptz NOT NULL DEFAULT now(),
            CONSTRAINT uq_ci_position UNIQUE (topic, partition, kafka_offset)
          );
          SQL
      - name: Build, test, and document dbt models
        env:
          BANKFLOW_DBT_HOST: 127.0.0.1
          BANKFLOW_DBT_PORT: "5432"
          BANKFLOW_DBT_DATABASE: bankflow_test
          BANKFLOW_DBT_USER: bankflow_test_user
          BANKFLOW_DBT_PASSWORD: ci-test-password
          BANKFLOW_DBT_SCHEMA: bankflow_analytics
        run: |
          dbt build --project-dir dbt --profiles-dir dbt
          dbt docs generate --project-dir dbt --profiles-dir dbt
