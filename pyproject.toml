[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bankflow-atm"
version = "0.1.0"
description = "Fictional ATM transaction and analytics portfolio project"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["docs/original-college-project", "graphify-out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
